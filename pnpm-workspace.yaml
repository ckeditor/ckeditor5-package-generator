packages:
  - packages/*

allowBuilds:
  esbuild: true
  puppeteer: true
  snyk: true

overrides:
  'brace-expansion@^5': '^5.0.8'
  'postcss@^8': '^8.5.18'
  'tar@^7': '^7.5.21'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
verifyDepsBeforeRun: false
